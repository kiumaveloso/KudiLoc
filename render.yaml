services:
  - type: web
    name: kudiloc-api
    runtime: docker
    dockerfilePath: ./KudivilaATMLocator/Dockerfile
    dockerContext: ./KudivilaATMLocator
    region: frankfurt  # Closest Render region to Angola
    plan: starter
    healthCheckPath: /health
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: MongoDbSettings__ConnectionString
        sync: false  # Must be set manually in Render dashboard (MongoDB Atlas connection string)
      - key: MongoDbSettings__DatabaseName
        value: KudiLoc
      - key: Jwt__Key
        generateValue: true  # Render auto-generates a random secret
      - key: Jwt__Issuer
        value: KudiLoc
      - key: Jwt__Audience
        value: KudiLoc
      - key: Jwt__ExpirationDays
        value: "7"
      - key: Cloudinary__CloudName
        sync: false  # Set manually in Render dashboard
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: AfricasTalking__ApiKey
        sync: false  # Set manually in Render dashboard
      - key: AfricasTalking__Username
        sync: false  # Set manually in Render dashboard
      - key: AfricasTalking__SenderId
        value: KudiLoc
      - key: Encryption__Key
        sync: false  # 32-byte base64 string: openssl rand -base64 32
      - key: Encryption__HmacKey
        sync: false  # 32+ byte base64 string: openssl rand -base64 32
      - key: Cors__AllowedOrigins__0
        sync: false  # Primary frontend URL, e.g. https://kudiloc.com
      - key: Cors__AllowedOrigins__1
        sync: false  # Secondary frontend URL, e.g. https://www.kudiloc.com
      - key: Redis__ConnectionString
        sync: false  # Upstash Redis connection string (optional, falls back to in-memory)
      - key: ApiKey
        sync: false  # Optional API key for X-API-Key header enforcement
