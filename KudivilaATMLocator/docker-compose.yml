services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDbSettings__ConnectionString=mongodb://mongo:27017
      - MongoDbSettings__DatabaseName=KudiLoc
      - Jwt__Key=YourSuperSecretKeyThatIsAtLeast32CharactersLongForProduction!
      - Jwt__Issuer=KudiLoc
      - Jwt__Audience=KudiLoc
      - Jwt__ExpirationDays=30
      - Encryption__Key=JVP78P0qfNJVk2guzRdus4djy/WIzKwGRmDBAQQMNr0=
      - Encryption__HmacKey=7ZvY3DeY+Zc6zdmfmwZVk5YFXPEtACUJgCUGOodWk8o=
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
        reservations:
          memory: 256M

volumes:
  mongo_data:
